services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
    env_file:
      - ../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/traffic_blocker
      REDIS_URL: redis://redis:6379
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,10.0.0.0/8
    depends_on:
      - mongo
      - redis
    ports:
      - "3000:3000"
  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
    command: npm run worker -w @traffic-blocker/backend
    env_file:
      - ../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/traffic_blocker
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

volumes:
  mongo:
